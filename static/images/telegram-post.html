<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Unbounded';font-weight:700;src:url('fonts/unbounded-700.ttf');}
@font-face{font-family:'Unbounded';font-weight:900;src:url('fonts/unbounded-900.ttf');}
@font-face{font-family:'Nunito';font-weight:700;src:url('fonts/nunito-700.ttf');}
@font-face{font-family:'Nunito';font-weight:800;src:url('fonts/nunito-800.ttf');}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0B0F1C;}
.pin{width:1080px;height:1080px;background:#0B0F1C;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;font-family:'Nunito',sans-serif;}
.glow{position:absolute;border-radius:50%;filter:blur(110px);opacity:.35;}
.glow.r{width:640px;height:640px;background:#FE2C55;top:-160px;left:-140px;}
.glow.c{width:600px;height:600px;background:#25F4EE;bottom:-140px;right:-120px;opacity:.22;}
.badge{margin-top:70px;z-index:2;font-family:'Unbounded';font-size:32px;font-weight:700;color:#25F4EE;border:2px solid #25F4EE;border-radius:100px;padding:12px 40px;}
h1{z-index:2;font-family:'Unbounded';font-weight:900;text-align:center;font-size:96px;line-height:1.12;margin-top:36px;padding:0 50px;}
h1 .red{color:#FE2C55;}
.sub{z-index:2;margin-top:24px;font-size:42px;font-weight:800;color:#c9d2e8;text-align:center;}
.sub b{color:#25F4EE;}
.checks{z-index:2;margin-top:52px;display:flex;flex-direction:column;gap:22px;}
.check{display:flex;align-items:center;gap:20px;font-size:38px;font-weight:700;}
.tick{width:60px;height:60px;border-radius:50%;background:rgba(37,244,238,.14);border:2px solid #25F4EE;color:#25F4EE;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;flex-shrink:0;}
.cta{z-index:2;margin-top:56px;font-family:'Unbounded';font-weight:700;font-size:44px;background:linear-gradient(135deg,#FE2C55,#ff5c7a);color:#fff;padding:28px 100px;border-radius:100px;box-shadow:0 12px 40px rgba(254,44,85,.5);}
.url{z-index:2;margin-top:30px;font-size:34px;color:#8b95b5;font-weight:700;letter-spacing:1px;}
.url b{color:#fff;}
</style></head>
<body><div class="pin">
<div class="glow r"></div><div class="glow c"></div>
<div class="badge">🔥 НОВАЯ ВЕРСИЯ</div>
<h1>Тик Ток <span class="red">Мод</span> 47.1.7</h1>
<div class="sub">Вышел! Работает в России <b>без VPN</b></div>
<div class="checks">
<div class="check"><div class="tick">✓</div>Лента грузится, видео выкладываются</div>
<div class="check"><div class="tick">✓</div>Серийчик и огонёк вернулись</div>
<div class="check"><div class="tick">✓</div>Без водяного знака и рекламы</div>
</div>
<div class="cta">Скачать бесплатно</div>
<div class="url"><b>тиктокмод.com</b></div>
</div></body></html>
