<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8">
<style>
@font-face{font-family:'Unbounded';font-weight:700;src:url('fonts/unbounded-700.ttf');}
@font-face{font-family:'Unbounded';font-weight:900;src:url('fonts/unbounded-900.ttf');}
@font-face{font-family:'Nunito';font-weight:700;src:url('fonts/nunito-700.ttf');}
@font-face{font-family:'Nunito';font-weight:800;src:url('fonts/nunito-800.ttf');}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0B0F1C;}
.pin{width:1080px;height:1350px;background:#0B0F1C;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;font-family:'Nunito',sans-serif;}
.glow{position:absolute;border-radius:50%;filter:blur(110px);opacity:.35;}
.glow.r{width:680px;height:680px;background:#FE2C55;top:-160px;left:-150px;}
.glow.c{width:620px;height:620px;background:#25F4EE;bottom:-150px;right:-130px;opacity:.22;}
.badge{margin-top:64px;z-index:2;font-family:'Unbounded';font-size:30px;font-weight:700;color:#25F4EE;border:2px solid #25F4EE;border-radius:100px;padding:12px 38px;}
h1{z-index:2;font-family:'Unbounded';font-weight:900;text-align:center;font-size:92px;line-height:1.12;margin-top:32px;padding:0 50px;}
h1 .red{color:#FE2C55;}
.sub{z-index:2;margin-top:22px;font-size:40px;font-weight:800;color:#c9d2e8;text-align:center;padding:0 60px;}
.sub b{color:#25F4EE;}
.phone{z-index:2;margin-top:44px;width:340px;height:560px;background:#141a2e;border-radius:50px;border:6px solid #2a3352;position:relative;box-shadow:0 0 70px rgba(254,44,85,.35),0 0 110px rgba(37,244,238,.18);overflow:hidden;}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:130px;height:26px;background:#0B0F1C;border-radius:20px;}
.screen{padding:60px 22px 18px;}
.vid{background:#1e2642;border-radius:16px;height:120px;margin-bottom:14px;position:relative;overflow:hidden;}
.vid::after{content:'▶';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;color:rgba(255,255,255,.85);}
.vid.v1{background:linear-gradient(135deg,#FE2C55,#7a1030);}
.vid.v2{background:linear-gradient(135deg,#25F4EE,#0e6f6b);}
.stats{display:flex;gap:10px;margin-top:4px;}
.stat{flex:1;background:#1e2642;border-radius:12px;padding:10px 0;text-align:center;font-weight:800;font-size:22px;}
.stat small{display:block;font-size:14px;color:#8b95b5;font-weight:700;}
.heart{color:#FE2C55;}
.checks{z-index:2;margin-top:40px;display:flex;flex-direction:column;gap:18px;}
.check{display:flex;align-items:center;gap:18px;font-size:36px;font-weight:700;}
.tick{width:58px;height:58px;border-radius:50%;background:rgba(37,244,238,.14);border:2px solid #25F4EE;color:#25F4EE;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;flex-shrink:0;}
.cta{z-index:2;margin-top:46px;font-family:'Unbounded';font-weight:700;font-size:42px;background:linear-gradient(135deg,#FE2C55,#ff5c7a);color:#fff;padding:26px 96px;border-radius:100px;box-shadow:0 12px 40px rgba(254,44,85,.5);}
.url{z-index:2;margin-top:24px;font-size:32px;color:#8b95b5;font-weight:700;letter-spacing:1px;}
.url b{color:#fff;}
</style></head>
<body><div class="pin">
<div class="glow r"></div><div class="glow c"></div>
<div class="badge">ОБХОД БЛОКИРОВКИ</div>
<h1>Тик Ток <span class="red">Мод</span> 47.1.7</h1>
<div class="sub">Работает в России <b>без VPN</b></div>
<div class="phone"><div class="notch"></div><div class="screen">
<div class="vid v1"></div><div class="vid v2"></div>
<div class="stats"><div class="stat"><span class="heart">♥</span> 124K<small>лайки</small></div><div class="stat">🔥 3дн<small>серийчик</small></div><div class="stat">▶ 2.1M<small>просмотры</small></div></div>
</div></div>
<div class="checks">
<div class="check"><div class="tick">✓</div>Серийчик и огонёк вернулись</div>
<div class="check"><div class="tick">✓</div>Без водяного знака и рекламы</div>
<div class="check"><div class="tick">✓</div>Установка за 2 минуты</div>
</div>
<div class="cta">Скачать бесплатно</div>
<div class="url"><b>тиктокмод.com</b></div>
</div></body></html>
